name: Verify

on:
  push:
  pull_request:

jobs:
  windows-desktop:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify renderer and Electron
        run: npm run verify:desktop
