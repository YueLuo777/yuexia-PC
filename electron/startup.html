<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>月下写作</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Microsoft YaHei UI", "Segoe UI", sans-serif;
        background: #f9fafb;
        color: #253342;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        overflow: hidden;
        border: 1px solid rgba(148, 163, 184, 0.34);
        background:
          radial-gradient(circle at 50% 12%, rgba(255, 255, 255, 0.96), transparent 42%),
          linear-gradient(145deg, #f9fafb 0%, #eef3f7 100%);
      }

      main {
        display: flex;
        width: 100%;
        flex-direction: column;
        align-items: center;
        padding: 34px 32px 30px;
        text-align: center;
      }

      .app-icon {
        width: 72px;
        height: 72px;
        filter: drop-shadow(0 10px 18px rgba(42, 72, 96, 0.16));
      }

      h1 {
        margin: 16px 0 6px;
        font-family: "STKaiti", "KaiTi", "Microsoft YaHei UI", sans-serif;
        font-size: 25px;
        font-weight: 700;
        letter-spacing: 0.16em;
      }

      p {
        margin: 0;
        color: #718096;
        font-size: 13px;
        letter-spacing: 0.04em;
      }

      .progress {
        position: relative;
        width: 176px;
        height: 3px;
        margin-top: 28px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(148, 163, 184, 0.24);
      }

      .progress::after {
        position: absolute;
        inset: 0 auto 0 0;
        width: 42%;
        border-radius: inherit;
        background: linear-gradient(90deg, #64b6c8, #3e8fa8);
        content: "";
        animation: opening 1.15s ease-in-out infinite;
      }

      @keyframes opening {
        0% {
          opacity: 0.35;
          transform: translateX(-110%);
        }
        55% {
          opacity: 1;
        }
        100% {
          opacity: 0.35;
          transform: translateX(340%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .progress::after {
          width: 100%;
          animation: none;
          opacity: 0.72;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img class="app-icon" src="../build/app-icon.png" alt="" />
      <h1>月下写作</h1>
      <p>正在整理你的创作空间</p>
      <div class="progress" aria-label="软件正在启动"></div>
    </main>
  </body>
</html>
